name: Daily Green

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  green:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Update file
        run: |
          echo "Last update: $(date -u)" > keepalive.txt

      - name: Commit
        run: |
          git add .
          git diff --cached --quiet || git commit -m "🌱 Daily contribution"

      - name: Push
        run: |
          git push